max_warm_rent: 800
min_rooms: 2.5
kitchen_required: true
regions:
  - Meldorf
  - Glückstadt
  - Lauenburg
  - Boizenburg
  - Lüneburg

# Optional language selection.
# Supported: en, de
# If omitted, system locale is used. Fallback is en.
language: en

demo:
  enabled: false

immowelt:
  enabled: true
  timeout_ms: 20000
  throttle_seconds: 2.0
  search_urls:
    # Copy the final Immowelt search result URL from your browser after setting filters.
    # Add one URL per region. city_hint helps if the result card text does not contain the city.
    - url: "https://www.immowelt.de/suche/meldorf/wohnungen/mieten"
      city_hint: "Meldorf"
    - url: "https://www.immowelt.de/suche/glueckstadt/wohnungen/mieten"
      city_hint: "Glückstadt"
    - url: "https://www.immowelt.de/suche/lauenburg-elbe/wohnungen/mieten"
      city_hint: "Lauenburg"
    - url: "https://www.immowelt.de/suche/boizenburg-elbe/wohnungen/mieten"
      city_hint: "Boizenburg"
    - url: "https://www.immowelt.de/suche/lueneburg/wohnungen/mieten"
      city_hint: "Lüneburg"
database_path: wohnungen.sqlite3

telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  username: ""
  password: ""
  recipient: ""
